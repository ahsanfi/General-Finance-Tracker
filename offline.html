<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>FinTracker — Connect to continue</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;color:#17221d;background:#f5f7f5}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
    main{max-width:360px}h1{font-size:28px;line-height:1.2;margin:24px 0 12px}p{line-height:1.6;color:#52625b}strong{color:#006d55}button{font:inherit;background:#006d55;color:white;border:0;border-radius:12px;min-height:48px;padding:12px 24px;cursor:pointer}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #4caa91;outline-offset:3px}
    @media(prefers-color-scheme:dark){:root{background:#080d0b;color:#f1f6f3}p{color:#b0c1b8}strong{color:#62d8b5}}
  </style>
</head>
<body><main><strong>FinTracker</strong><h1>Connect to open your finances</h1><p>Your connection is unavailable. Turn on Wi-Fi or mobile data, then try again.</p><button id="retry" type="button">Try again</button><p id="status" role="status">Your spreadsheet has not been changed.</p></main>
<script>
  document.getElementById('retry').onclick = () => {
    if (!navigator.onLine) { document.getElementById('status').textContent='You still appear to be offline. Check your connection first.'; return; }
    location.replace(new URL('./',location.href).href);
  };
  addEventListener('online',()=>{ document.getElementById('status').textContent='Connection detected. Tap Try again to open FinTracker.'; });
</script></body></html>
